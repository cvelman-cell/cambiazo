<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🃏 Cambiazo!</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #1a1a2e;
    font-family: 'Press Start 2P', monospace;
    color: #e0e0e0;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ── LOBBY ── */
  #lobby {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; padding: 20px;
    background: linear-gradient(180deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
  }
  #lobby h1 {
    font-size: clamp(24px, 6vw, 48px);
    color: #fcbf49;
    text-shadow: 3px 3px 0 #e63946, 6px 6px 0 #1d3557;
    margin-bottom: 8px;
    animation: titleBounce 2s ease-in-out infinite;
  }
  @keyframes titleBounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  #lobby .subtitle {
    font-size: clamp(8px, 2vw, 12px);
    color: #48cae4;
    margin-bottom: 30px;
  }
  .lobby-form {
    background: #16213e;
    border: 3px solid #48cae4;
    border-radius: 4px;
    padding: 24px;
    width: min(90vw, 400px);
    display: flex; flex-direction: column; gap: 16px;
    image-rendering: pixelated;
    box-shadow: 0 0 20px rgba(72, 202, 228, 0.3);
  }
  .lobby-form label {
    font-size: 10px;
    color: #52b788;
  }
  .lobby-form input {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    background: #0f0f23;
    border: 2px solid #52b788;
    color: #e0e0e0;
    padding: 10px;
    border-radius: 2px;
    outline: none;
    width: 100%;
  }
  .lobby-form input:focus { border-color: #fcbf49; }
  .btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    padding: 14px 20px;
    border: none;
    border-radius: 2px;
    cursor: pointer;
    transition: transform 0.1s;
    text-transform: uppercase;
  }
  .btn:active { transform: scale(0.95); }
  .btn-primary {
    background: #52b788;
    color: #0f0f23;
    box-shadow: 0 4px 0 #2d6a4f;
  }
  .btn-primary:hover { background: #6bcf9a; }
  .btn-primary:disabled { background: #555; color: #888; box-shadow: 0 4px 0 #333; cursor: not-allowed; }
  .btn-accent {
    background: #fcbf49;
    color: #0f0f23;
    box-shadow: 0 4px 0 #f77f00;
  }
  .btn-danger {
    background: #e63946;
    color: #fff;
    box-shadow: 0 4px 0 #9b2226;
  }

  /* ── WAITING ROOM ── */
  #waitingRoom {
    display: none; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; padding: 20px;
    background: linear-gradient(180deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
  }
  #waitingRoom h2 {
    font-size: clamp(16px, 4vw, 28px);
    color: #fcbf49;
    margin-bottom: 20px;
  }
  .player-list {
    background: #16213e;
    border: 3px solid #48cae4;
    border-radius: 4px;
    padding: 16px;
    width: min(90vw, 400px);
    min-height: 100px;
    margin-bottom: 20px;
  }
  .player-list .player-item {
    font-size: 11px;
    padding: 8px;
    color: #52b788;
    border-bottom: 1px solid #1a1a2e;
    display: flex; justify-content: space-between;
  }
  .player-item .age-badge {
    background: #e040fb;
    color: #0f0f23;
    padding: 2px 6px;
    font-size: 8px;
    border-radius: 2px;
  }
  .waiting-dots::after {
    content: '';
    animation: dots 1.5s infinite;
  }
  @keyframes dots {
    0% { content: '.'; }
    33% { content: '..'; }
    66% { content: '...'; }
  }
  .waiting-msg {
    font-size: 10px;
    color: #48cae4;
    margin-bottom: 16px;
    text-align: center;
  }

  /* ── GAME ── */
  #gameScreen {
    display: none;
    height: 100vh; width: 100vw;
    position: relative;
  }
  #gameCanvas {
    display: block;
    width: 100vw;
    height: 100vh;
    image-rendering: auto;
  }

  /* ── OVERLAYS ── */
  .overlay {
    display: none;
    position: fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(10,10,30,0.92);
    z-index: 100;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 20px;
  }
  .overlay.active { display: flex; }
  .overlay h2 {
    font-size: clamp(14px, 4vw, 24px);
    color: #fcbf49;
    text-align: center;
  }
  .overlay .score-table {
    width: min(90vw, 500px);
    border-collapse: collapse;
    font-size: 9px;
  }
  .score-table th {
    background: #1d3557;
    color: #48cae4;
    padding: 8px;
    text-align: center;
  }
  .score-table td {
    background: #16213e;
    color: #e0e0e0;
    padding: 8px;
    text-align: center;
    border: 1px solid #1d3557;
  }
  .score-table .penalty { color: #e63946; }
  .score-table .winner { color: #52b788; }
  .score-table .winner td { background: #1a3a2e; }

  /* ── HUD ── */
  #hud {
    display: none;
    position: fixed; top: 0; left: 0; right: 0;
    padding: 6px 12px;
    background: rgba(15,15,35,0.85);
    z-index: 50;
    font-size: 9px;
    color: #48cae4;
    justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 4px;
  }
  #hud .round-info { color: #fcbf49; }
  #hud .turn-info { color: #52b788; }
  #hud .score-summary { color: #e040fb; }

  #actionBar {
    display: none;
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 10px;
    background: rgba(15,15,35,0.9);
    z-index: 50;
    flex-direction: row; justify-content: center; gap: 8px; flex-wrap: wrap;
  }
  #actionBar .btn { font-size: 9px; padding: 10px 14px; }

  #toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(15,15,35,0.95);
    border: 2px solid #fcbf49;
    color: #fcbf49;
    padding: 16px 24px;
    font-size: 11px;
    z-index: 200;
    text-align: center;
    display: none;
    border-radius: 4px;
    pointer-events: none;
  }

  /* Diagonal choice modal */
  #diagonalModal {
    display: none;
    position: fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(10,10,30,0.9);
    z-index: 150;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 16px;
  }
  #diagonalModal.active { display: flex; }
  #diagonalModal h3 { font-size: 14px; color: #fcbf49; }

  /* Music toggle */
  #musicToggle {
    position: fixed; top: 8px; right: 8px;
    z-index: 60;
    background: #16213e;
    border: 2px solid #48cae4;
    color: #48cae4;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    padding: 6px 10px;
    cursor: pointer;
    border-radius: 2px;
  }
</style>
</head>
<body>

<!-- LOBBY -->
<div id="lobby">
  <h1>CAMBIAZO!</h1>
  <div class="subtitle">🃏 Juego de cartas multijugador 🃏</div>
  <div class="lobby-form">
    <label>NICKNAME</label>
    <input type="text" id="nicknameInput" maxlength="15" placeholder="Tu nombre...">
    <label>EDAD</label>
    <input type="number" id="ageInput" min="5" max="99" placeholder="Edad">
    <button class="btn btn-primary" id="joinBtn" onclick="joinGame()">ENTRAR A SALA</button>
  </div>
</div>

<!-- WAITING ROOM -->
<div id="waitingRoom">
  <h2>SALA DE ESPERA</h2>
  <div class="player-list" id="playerList"></div>
  <div class="waiting-msg" id="waitingMsg">Esperando jugadores<span class="waiting-dots"></span></div>
  <button class="btn btn-accent" id="startBtn" style="display:none" onclick="requestStart()">¡INICIAR JUEGO!</button>
</div>

<!-- GAME -->
<div id="gameScreen">
  <canvas id="gameCanvas"></canvas>
</div>

<div id="hud">
  <span class="round-info" id="roundInfo"></span>
  <span class="turn-info" id="turnInfo"></span>
  <span class="score-summary" id="scoreSummary"></span>
</div>

<div id="actionBar">
  <button class="btn btn-primary" id="btnDrawDeck" onclick="drawFromDeck()">ROBAR MAZO 🂠</button>
  <button class="btn btn-accent" id="btnDrawDiscard" onclick="drawFromDiscard()">TOMAR DESCARTE 🂡</button>
  <button class="btn btn-danger" id="btnDiscard" onclick="discardDrawn()" style="display:none">DESCARTAR CARTA ✕</button>
</div>

<button id="musicToggle" onclick="toggleMusic()">♪ ON</button>

<div id="toast"></div>

<!-- OVERLAYS -->
<div class="overlay" id="roundOverlay">
  <h2 id="roundTitle">FIN DE RONDA</h2>
  <table class="score-table" id="roundScoreTable"></table>
  <button class="btn btn-accent" onclick="nextRound()">SIGUIENTE RONDA</button>
</div>

<div class="overlay" id="gameOverOverlay">
  <h2>🏆 FIN DEL JUEGO 🏆</h2>
  <table class="score-table" id="finalScoreTable"></table>
  <button class="btn btn-accent" onclick="playAgain()">JUGAR DE NUEVO</button>
</div>

<div id="diagonalModal">
  <h3>¿Cómo redistribuir?</h3>
  <button class="btn btn-primary" onclick="chooseDiagonal('2x3')">2 × 3 (2 filas)</button>
  <button class="btn btn-accent" onclick="chooseDiagonal('3x2')">3 × 2 (3 filas)</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ═══════════════════════════════════════════
//  CAMBIAZO! CLIENT
// ═══════════════════════════════════════════

const socket = io();
let myId = null;
let gameState = null;
let myPlayer = null;
let drawnCard = null;
let turnPhase = 'wait'; // wait, draw, place, mustFlip, flipping
let isMyTurn = false;
let animationQueue = [];
let particles = [];

// Canvas
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H;
let scale = 1;

// Card dimensions (base, will scale)
const BASE_CARD_W = 60;
const BASE_CARD_H = 84;
const CARD_GAP = 8;

// Colors
const COLORS_MAP = {
  verde_oscuro: '#2d6a4f',
  verde_claro: '#52b788',
  azul_oscuro: '#1d3557',
  celeste: '#48cae4',
  rojo: '#e63946',
  naranja: '#f77f00',
  amarillo: '#fcbf49',
  magenta: '#e040fb'
};
const BG_COLOR = '#1a1a2e';
const TABLE_COLOR = '#16213e';

// Layout positions (computed on resize)
let layout = {};

// ── RESIZE ──
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * devicePixelRatio;
  canvas.height = H * devicePixelRatio;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

  // Compute card scale based on screen
  const maxCardW = Math.min(W / 6, 70);
  scale = maxCardW / BASE_CARD_W;

  computeLayout();
}

function computeLayout() {
  if (!gameState) return;
  const cw = BASE_CARD_W * scale;
  const ch = BASE_CARD_H * scale;
  const gap = CARD_GAP * scale;

  layout = { players: {}, deck: {}, discard: {}, drawnCard: {} };

  const me = gameState.players.find(p => p.id === myId);
  const others = gameState.players.filter(p => p.id !== myId);

  // My cards at bottom
  if (me) {
    const cols = me.matrixCols || 3;
    const rows = me.matrixRows || 3;
    const matW = cols * cw + (cols - 1) * gap;
    const matH = rows * ch + (rows - 1) * gap;
    layout.players[me.id] = {
      x: (W - matW) / 2,
      y: H - matH - 80,
      cardW: cw, cardH: ch, gap, isMine: true,
    };
  }

  // Others at top area
  const topY = 50;
  const smallScale = scale * 0.55;
  const scw = BASE_CARD_W * smallScale;
  const sch = BASE_CARD_H * smallScale;
  const sgap = CARD_GAP * smallScale;

  const totalWidth = others.length * (3 * scw + 2 * sgap + 30);
  let startX = Math.max(10, (W - totalWidth) / 2);

  others.forEach((p, i) => {
    const cols = p.matrixCols || 3;
    const mw = cols * scw + (cols - 1) * sgap;
    layout.players[p.id] = {
      x: startX + i * (mw + 40),
      y: topY,
      cardW: scw, cardH: sch, gap: sgap, isMine: false,
    };
  });

  // Deck & discard in center
  const centerY = H * 0.38;
  layout.deck = { x: W / 2 - cw - 10, y: centerY - ch / 2, w: cw, h: ch };
  layout.discard = { x: W / 2 + 10, y: centerY - ch / 2, w: cw, h: ch };
  layout.drawnCard = { x: W / 2 - cw / 2, y: centerY + ch / 2 + 15, w: cw, h: ch };
}

window.addEventListener('resize', () => { resize(); render(); });

// ── DRAWING ──
function drawPixelCard(x, y, w, h, card, faceUp, highlight = false) {
  ctx.save();

  if (faceUp && card) {
    // Card face
    const baseColor = COLORS_MAP[card.color] || '#555';
    ctx.fillStyle = baseColor;
    ctx.fillRect(x, y, w, h);

    // Inner border
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 3, y + 3, w - 6, h - 6);

    // Outer border
    ctx.strokeStyle = '#0f0f23';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);

    // Number
    const fontSize = Math.max(10, Math.floor(w * 0.32));
    ctx.font = `${fontSize}px "Press Start 2P", monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillText(String(card.value), x + w / 2 + 1, y + h / 2 + 1);

    // Text
    ctx.fillStyle = '#fff';
    ctx.fillText(String(card.value), x + w / 2, y + h / 2);

    // Small color indicator dots in corners
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    const dotS = Math.max(3, w * 0.06);
    ctx.fillRect(x + 5, y + 5, dotS, dotS);
    ctx.fillRect(x + w - 5 - dotS, y + h - 5 - dotS, dotS, dotS);

  } else {
    // Card back - pixel pattern
    ctx.fillStyle = '#2a1a4e';
    ctx.fillRect(x, y, w, h);

    ctx.strokeStyle = '#4a2a7e';
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 3, y + 3, w - 6, h - 6);

    // Pixel cross-hatch pattern
    ctx.fillStyle = '#3a2060';
    const step = Math.max(6, Math.floor(w / 8));
    for (let px = x + 6; px < x + w - 6; px += step) {
      for (let py = y + 6; py < y + h - 6; py += step) {
        if ((Math.floor((px - x) / step) + Math.floor((py - y) / step)) % 2 === 0) {
          ctx.fillRect(px, py, step - 2, step - 2);
        }
      }
    }

    // Center "?" 
    const fontSize = Math.max(10, Math.floor(w * 0.35));
    ctx.font = `${fontSize}px "Press Start 2P", monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#6a4aae';
    ctx.fillText('?', x + w / 2, y + h / 2);

    ctx.strokeStyle = '#0f0f23';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);
  }

  if (highlight) {
    ctx.strokeStyle = '#fcbf49';
    ctx.lineWidth = 3;
    ctx.strokeRect(x - 2, y - 2, w + 4, h + 4);
    // Glow
    ctx.shadowColor = '#fcbf49';
    ctx.shadowBlur = 10;
    ctx.strokeRect(x - 2, y - 2, w + 4, h + 4);
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}

function drawDeck(x, y, w, h, count) {
  // Stack effect
  const stackCount = Math.min(4, Math.floor(count / 10) + 1);
  for (let i = stackCount - 1; i >= 0; i--) {
    const ox = x - i * 2;
    const oy = y - i * 2;
    ctx.fillStyle = i === 0 ? '#2a1a4e' : '#1a0e3e';
    ctx.fillRect(ox, oy, w, h);
    ctx.strokeStyle = '#0f0f23';
    ctx.lineWidth = 2;
    ctx.strokeRect(ox, oy, w, h);
  }

  // "MAZO" label
  const fs = Math.max(7, Math.floor(w * 0.16));
  ctx.font = `${fs}px "Press Start 2P", monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#6a4aae';
  ctx.fillText('MAZO', x + w / 2, y + h / 2 - fs * 0.6);
  ctx.fillStyle = '#48cae4';
  ctx.font = `${fs * 0.8}px "Press Start 2P", monospace`;
  ctx.fillText(`(${count})`, x + w / 2, y + h / 2 + fs * 0.6);
}

function drawDiscardPile(x, y, w, h, topCard) {
  if (topCard) {
    drawPixelCard(x, y, w, h, topCard, true);
    // Label
    const fs = Math.max(6, Math.floor(w * 0.12));
    ctx.font = `${fs}px "Press Start 2P", monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText('DESCARTE', x + w / 2, y + h + fs + 4);
  } else {
    ctx.fillStyle = '#16213e';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.strokeRect(x, y, w, h);
    ctx.setLineDash([]);
  }
}

function drawPlayerName(x, y, w, nickname, isCurrentTurn, isMine) {
  const fs = isMine ? 10 : 7;
  ctx.font = `${fs}px "Press Start 2P", monospace`;
  ctx.textAlign = 'center';
  ctx.fillStyle = isCurrentTurn ? '#fcbf49' : (isMine ? '#52b788' : '#48cae4');
  ctx.fillText(nickname + (isCurrentTurn ? ' ◄' : ''), x + w / 2, y - 6);
}

function render() {
  if (!gameState) return;

  ctx.clearRect(0, 0, W, H);

  // Background
  ctx.fillStyle = BG_COLOR;
  ctx.fillRect(0, 0, W, H);

  // Table felt
  const mx = 20, my = 40;
  ctx.fillStyle = TABLE_COLOR;
  ctx.fillRect(mx, my, W - mx * 2, H - my * 2);
  ctx.strokeStyle = '#2d6a4f';
  ctx.lineWidth = 3;
  ctx.strokeRect(mx, my, W - mx * 2, H - my * 2);

  // Deck
  const dl = layout.deck;
  if (dl) {
    const hl = isMyTurn && turnPhase === 'draw';
    if (hl) {
      const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 400);
      ctx.shadowColor = '#52b788';
      ctx.shadowBlur = 8 + pulse * 8;
      ctx.strokeStyle = '#52b788';
      ctx.lineWidth = 2;
      ctx.strokeRect(dl.x - 4, dl.y - 4, dl.w + 8, dl.h + 8);
      ctx.shadowBlur = 0;
      // Label
      const lfs = Math.max(6, dl.w * 0.11);
      ctx.font = `${lfs}px "Press Start 2P", monospace`;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#52b788';
      ctx.fillText('▼ TOCA', dl.x + dl.w / 2, dl.y + dl.h + lfs + 6);
    }
    drawDeck(dl.x, dl.y, dl.w, dl.h, gameState.deckCount);
  }

  // Discard
  const dsl = layout.discard;
  if (dsl) {
    const hl = isMyTurn && turnPhase === 'draw';
    if (hl && gameState.discardTop) {
      const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 400);
      ctx.shadowColor = '#fcbf49';
      ctx.shadowBlur = 8 + pulse * 8;
      ctx.strokeStyle = '#fcbf49';
      ctx.lineWidth = 2;
      ctx.strokeRect(dsl.x - 4, dsl.y - 4, dsl.w + 8, dsl.h + 8);
      ctx.shadowBlur = 0;
      // Label
      const lfs = Math.max(6, dsl.w * 0.11);
      ctx.font = `${lfs}px "Press Start 2P", monospace`;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fcbf49';
      ctx.fillText('▼ TOCA', dsl.x + dsl.w / 2, dsl.y + dsl.h + lfs + 6);
    }
    drawDiscardPile(dsl.x, dsl.y, dsl.w, dsl.h, gameState.discardTop);
  }

  // Drawn card
  if (drawnCard && layout.drawnCard) {
    const dcl = layout.drawnCard;
    
    // Pulsing glow background
    const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 300);
    ctx.shadowColor = '#fcbf49';
    ctx.shadowBlur = 15 + pulse * 10;
    ctx.fillStyle = 'rgba(252,191,73,0.15)';
    ctx.fillRect(dcl.x - 8, dcl.y - 8, dcl.w + 16, dcl.h + 16);
    ctx.shadowBlur = 0;
    
    drawPixelCard(dcl.x, dcl.y, dcl.w, dcl.h, drawnCard, true, true);
    
    const fs = Math.max(7, dcl.w * 0.14);
    ctx.font = `${fs}px "Press Start 2P", monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fcbf49';
    ctx.fillText('CARTA ROBADA', dcl.x + dcl.w / 2, dcl.y - 12);
    
    // Instructions below drawn card
    if (isMyTurn && turnPhase === 'place') {
      const insFs = Math.max(6, dcl.w * 0.11);
      ctx.font = `${insFs}px "Press Start 2P", monospace`;
      ctx.fillStyle = '#52b788';
      ctx.fillText('▲ TOCA UNA CARTA PARA CAMBIAR', dcl.x + dcl.w / 2, dcl.y + dcl.h + insFs + 6);
      ctx.fillStyle = '#e63946';
      ctx.fillText('O DESCARTA ABAJO ▼', dcl.x + dcl.w / 2, dcl.y + dcl.h + insFs * 2 + 12);
    }
  }

  // Players' cards
  for (const player of gameState.players) {
    const pl = layout.players[player.id];
    if (!pl) continue;

    const isCurrentTurn = gameState.currentPlayerId === player.id;
    const cols = player.matrixCols || 3;
    const rows = player.matrixRows || 3;
    const matW = cols * pl.cardW + (cols - 1) * pl.gap;

    drawPlayerName(pl.x, pl.y, matW, player.nickname, isCurrentTurn, pl.isMine);

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = player.matrix[r] && player.matrix[r][c];
        if (!cell || !cell.hasCard) continue;

        const cx = pl.x + c * (pl.cardW + pl.gap);
        const cy = pl.y + r * (pl.cardH + pl.gap);

        const canInteract = pl.isMine && isMyTurn;
        const highlight = canInteract && (turnPhase === 'place' || turnPhase === 'mustFlip');

        drawPixelCard(cx, cy, pl.cardW, pl.cardH, cell.card, cell.faceUp,
          highlight && (turnPhase === 'place' || (turnPhase === 'mustFlip' && !cell.faceUp))
        );
      }
    }
  }

  // Particles
  renderParticles();

  requestAnimationFrame(render);
}

// ── PARTICLES ──
function addParticles(x, y, color, count = 20) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8 - 3,
      size: 2 + Math.random() * 4,
      color,
      life: 1,
      decay: 0.02 + Math.random() * 0.03,
    });
  }
}

function renderParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life -= p.decay;

    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }

    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
    ctx.globalAlpha = 1;
  }
}

// ── TOAST ──
function showToast(msg, duration = 2000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._timeout);
  t._timeout = setTimeout(() => { t.style.display = 'none'; }, duration);
}

// ── INPUT HANDLING ──
canvas.addEventListener('click', handleCanvasClick);
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  handleCanvasClick({ clientX: touch.clientX, clientY: touch.clientY });
}, { passive: false });

function handleCanvasClick(e) {
  if (!gameState || !isMyTurn) return;
  const mx = e.clientX;
  const my = e.clientY;

  // Check deck click
  if (turnPhase === 'draw') {
    const dl = layout.deck;
    if (dl && mx >= dl.x && mx <= dl.x + dl.w && my >= dl.y && my <= dl.y + dl.h) {
      drawFromDeck();
      return;
    }
    const dsl = layout.discard;
    if (dsl && mx >= dsl.x && mx <= dsl.x + dsl.w && my >= dsl.y && my <= dsl.y + dsl.h) {
      drawFromDiscard();
      return;
    }
  }

  // Check own matrix clicks
  if (turnPhase === 'place' || turnPhase === 'mustFlip' || turnPhase === 'flipping') {
    const me = gameState.players.find(p => p.id === myId);
    if (!me) return;
    const pl = layout.players[myId];
    if (!pl) return;

    for (let r = 0; r < (me.matrixRows || 3); r++) {
      for (let c = 0; c < (me.matrixCols || 3); c++) {
        const cell = me.matrix[r] && me.matrix[r][c];
        if (!cell || !cell.hasCard) continue;

        const cx = pl.x + c * (pl.cardW + pl.gap);
        const cy = pl.y + r * (pl.cardH + pl.gap);

        if (mx >= cx && mx <= cx + pl.cardW && my >= cy && my <= cy + pl.cardH) {
          if (turnPhase === 'flipping') {
            if (!cell.faceUp) {
              socket.emit('flipCard', { row: r, col: c });
            }
          } else if (turnPhase === 'place') {
            socket.emit('placeCard', { row: r, col: c });
          } else if (turnPhase === 'mustFlip') {
            if (!cell.faceUp) {
              socket.emit('flipOwnCard', { row: r, col: c });
            }
          }
          return;
        }
      }
    }
  }
}

// ── ACTION BUTTONS ──
function drawFromDeck() {
  if (!isMyTurn || turnPhase !== 'draw') return;
  socket.emit('drawFromDeck');
}

function drawFromDiscard() {
  if (!isMyTurn || turnPhase !== 'draw') return;
  socket.emit('drawFromDiscard');
}

function discardDrawn() {
  if (!isMyTurn || turnPhase !== 'place') return;
  socket.emit('discardDrawn');
}

function chooseDiagonal(choice) {
  socket.emit('diagonalChoice', { choice });
  document.getElementById('diagonalModal').classList.remove('active');
}

function nextRound() {
  document.getElementById('roundOverlay').classList.remove('active');
  socket.emit('nextRound');
}

function playAgain() {
  document.getElementById('gameOverOverlay').classList.remove('active');
  socket.emit('playAgain');
}

function updateHUD() {
  if (!gameState) return;
  document.getElementById('roundInfo').textContent = `RONDA ${gameState.currentRound}/${gameState.totalRounds}`;

  const currentPlayer = gameState.players[gameState.currentPlayerIndex];
  document.getElementById('turnInfo').textContent = currentPlayer ?
    (currentPlayer.id === myId ? '► TU TURNO' : `► Turno: ${currentPlayer.nickname}`) : '';

  const scores = gameState.roundScores || [];
  const myScores = scores.find(s => s.playerId === myId);
  document.getElementById('scoreSummary').textContent = myScores ?
    `Pts: ${myScores.scores.join(' + ')} = ${myScores.scores.reduce((a, b) => a + b, 0)}` : '';
}

function updateActionBar() {
  const bar = document.getElementById('actionBar');
  const btnDeck = document.getElementById('btnDrawDeck');
  const btnDiscard = document.getElementById('btnDrawDiscard');
  const btnDiscardDrawn = document.getElementById('btnDiscard');

  if (!isMyTurn || gameState?.state !== 'playing') {
    bar.style.display = 'none';
    return;
  }

  bar.style.display = 'flex';

  if (turnPhase === 'draw') {
    btnDeck.style.display = 'block';
    btnDiscard.style.display = gameState.discardTop ? 'block' : 'none';
    btnDiscardDrawn.style.display = 'none';
  } else if (turnPhase === 'place') {
    btnDeck.style.display = 'none';
    btnDiscard.style.display = 'none';
    btnDiscardDrawn.style.display = 'block';
  } else {
    bar.style.display = 'none';
  }
}

function showRoundScores(scores) {
  const overlay = document.getElementById('roundOverlay');
  const table = document.getElementById('roundScoreTable');
  const roundNum = gameState?.currentRound || 1;
  document.getElementById('roundTitle').textContent = `FIN DE RONDA ${roundNum}`;

  const lowestScore = Math.min(...scores.map(s => s.finalScore));

  let html = '<tr><th>JUGADOR</th><th>CARTAS</th><th>PUNTOS</th><th>FINAL</th></tr>';
  for (const s of scores.sort((a, b) => a.finalScore - b.finalScore)) {
    const isWinner = s.finalScore === lowestScore;
    const cls = s.penalty ? 'penalty' : (isWinner ? 'winner' : '');
    html += `<tr class="${cls}">
      <td>${s.nickname}</td>
      <td>${s.cardsLeft}</td>
      <td>${s.rawScore}${s.penalty ? ' ×2!' : ''}</td>
      <td>${s.finalScore}</td>
    </tr>`;
  }
  table.innerHTML = html;
  overlay.classList.add('active');
}

function showFinalScores(finalScores) {
  const overlay = document.getElementById('gameOverOverlay');
  const table = document.getElementById('finalScoreTable');

  const allRounds = finalScores[0]?.scores?.length || 3;
  let headerHtml = '<tr><th>JUGADOR</th>';
  for (let i = 1; i <= allRounds; i++) headerHtml += `<th>R${i}</th>`;
  headerHtml += '<th>TOTAL</th></tr>';

  let bodyHtml = '';
  finalScores.forEach((s, idx) => {
    const cls = idx === 0 ? 'winner' : '';
    bodyHtml += `<tr class="${cls}"><td>${idx === 0 ? '🏆 ' : ''}${s.nickname}</td>`;
    for (const sc of s.scores) bodyHtml += `<td>${sc}</td>`;
    bodyHtml += `<td>${s.total}</td></tr>`;
  });

  table.innerHTML = headerHtml + bodyHtml;
  overlay.classList.add('active');
}

// ── SOCKET EVENTS ──
socket.on('connect', () => { myId = socket.id; });

socket.on('lobbyUpdate', (data) => {
  const list = document.getElementById('playerList');
  list.innerHTML = data.players.map(p =>
    `<div class="player-item">
      <span>${p.nickname}${p.id === myId ? ' (tú)' : ''}</span>

  ).join('');

  } else {
    startBtn.style.display = 'none';
    waitMsg.innerHTML = `${data.players.length}/${data.minPlayers} mínimo - Esperando<span class="waiting-dots"></span>`;
  }
});

socket.on('gameStarted', (state) => {
  gameState = state;
  drawnCard = null;
  turnPhase = 'flipping';
  isMyTurn = true; // everyone flips during setup

  document.getElementById('waitingRoom').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'block';
  document.getElementById('hud').style.display = 'flex';

  resize();
  showToast('¡Elige 2 cartas para voltear!', 3000);
  updateHUD();
  updateActionBar();
  render();
  startMusic();
});

socket.on('cardFlipped', (data) => {
  if (!gameState) return;

  const player = gameState.players.find(p => p.id === data.playerId);
  if (player && player.matrix[data.row] && player.matrix[data.row][data.col]) {
    player.matrix[data.row][data.col].faceUp = true;
    player.matrix[data.row][data.col].card = data.card;

    // Particles on flip
    const pl = layout.players[data.playerId];
    if (pl) {
      const fx = pl.x + data.col * (pl.cardW + pl.gap) + pl.cardW / 2;
      const fy = pl.y + data.row * (pl.cardH + pl.gap) + pl.cardH / 2;
      addParticles(fx, fy, COLORS_MAP[data.card.color] || '#fff', 10);
    }
  }

  if (data.playerId === myId && data.flippedCount >= 2) {
    showToast('Esperando a los demás...');
    turnPhase = 'wait';
  }
});

socket.on('gameState', (state) => {
  gameState = state;
  isMyTurn = state.currentPlayerId === myId;
  turnPhase = isMyTurn ? 'draw' : 'wait';
  drawnCard = state.drawnCard || null;

  computeLayout();
  updateHUD();
  updateActionBar();

  if (isMyTurn && state.state === 'playing') {
    showToast('¡Tu turno! Roba del MAZO o del DESCARTE', 3000);
  }
});

socket.on('cardDrawn', (data) => {
  drawnCard = data.card;
  if (data.playerId === myId) {
    turnPhase = 'place';
  }
  if (gameState) {
    gameState.deckCount = data.deckCount;
    if (data.discardTop !== undefined) gameState.discardTop = data.discardTop;
  }
  updateActionBar();

  if (data.playerId !== myId) {
    showToast(`${getPlayerName(data.playerId)} robó: ${data.card.value} ${data.card.colorName}`, 2500);
  } else {
    showToast(`Sacaste: ${data.card.value} ${data.card.colorName} — ¡Elige dónde colocarla!`, 3000);
  }
});

socket.on('cardPlaced', (data) => {
  if (!gameState) return;
  const player = gameState.players.find(p => p.id === data.playerId);
  if (player && player.matrix[data.row]) {
    player.matrix[data.row][data.col] = {
      card: data.newCard,
      faceUp: true,
      hasCard: true,
    };
  }
  gameState.discardTop = data.discardTop;
  drawnCard = null;

  if (data.elimination) {
    handleEliminationVisual(data.playerId, data.elimination);
  }
});

socket.on('cardDiscarded', (data) => {
  if (gameState) gameState.discardTop = data.discardTop;
  drawnCard = null;
  if (data.playerId === myId) {
    turnPhase = 'mustFlip';
    showToast('Descartaste — ahora voltea una carta boca abajo', 3000);
  }
  updateActionBar();
});

socket.on('mustFlipCard', () => {
  turnPhase = 'mustFlip';
  showToast('Toca una carta boca abajo para voltearla', 3000);
  updateActionBar();
});

socket.on('ownCardFlipped', (data) => {
  if (!gameState) return;
  const player = gameState.players.find(p => p.id === data.playerId);
  if (player && player.matrix[data.row]) {
    player.matrix[data.row][data.col].faceUp = true;
    player.matrix[data.row][data.col].card = data.card;
  }

  const pl = layout.players[data.playerId];
  if (pl) {
    const fx = pl.x + data.col * (pl.cardW + pl.gap) + pl.cardW / 2;
    const fy = pl.y + data.row * (pl.cardH + pl.gap) + pl.cardH / 2;
    addParticles(fx, fy, COLORS_MAP[data.card.color] || '#fff', 10);
  }

  if (data.elimination) {
    handleEliminationVisual(data.playerId, data.elimination);
  }
});

socket.on('chooseDiagonalLayout', () => {
  document.getElementById('diagonalModal').classList.add('active');
});

socket.on('diagonalEliminated', (data) => {
  if (!gameState) return;
  const player = gameState.players.find(p => p.id === data.playerId);
  if (player) {
    player.matrixRows = data.newMatrixRows;
    player.matrixCols = data.newMatrixCols;
  }
  handleEliminationVisual(data.playerId, data.elimination);
  computeLayout();
});

socket.on('roundEnded', (data) => {
  gameState = data.gameState;
  computeLayout();
  isMyTurn = false;
  turnPhase = 'wait';
  drawnCard = null;
  updateActionBar();

  setTimeout(() => {
    showRoundScores(data.scores);
  }, 1500);

  const enderName = getPlayerName(data.roundEnder);
  const reason = data.reason === 'allEliminated' ?
    `${enderName} eliminó todas sus cartas!` :
    `${enderName} volteó todas sus cartas!`;
  showToast(reason, 3000);
});

socket.on('gameOver', (data) => {
  isMyTurn = false;
  turnPhase = 'wait';
  updateActionBar();
  setTimeout(() => showFinalScores(data.finalScores), 500);
});

socket.on('playerLeft', (data) => {
  showToast('Un jugador se desconectó');
});

socket.on('gameCancelled', (data) => {
  showToast(data.reason, 4000);
  // Back to lobby
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('hud').style.display = 'none';
  document.getElementById('actionBar').style.display = 'none';
  document.getElementById('waitingRoom').style.display = 'flex';
});

// ── HELPERS ──
function getPlayerName(id) {
  if (!gameState) return '???';
  const p = gameState.players.find(p => p.id === id);
  return p ? p.nickname : '???';
}

function handleEliminationVisual(playerId, elimination) {
  const pl = layout.players[playerId];
  if (!pl) return;

  // Spawn lots of particles at eliminated card positions
  for (const { r, c } of elimination.cells) {
    const fx = pl.x + c * (pl.cardW + pl.gap) + pl.cardW / 2;
    const fy = pl.y + r * (pl.cardH + pl.gap) + pl.cardH / 2;
    const color = elimination.cards?.[0]?.colorHex || '#fcbf49';
    addParticles(fx, fy, color, 25);
    addParticles(fx, fy, '#fff', 10);
  }

  showToast(`¡${getPlayerName(playerId)} eliminó una línea!`, 2500);

  // Update matrix - remove eliminated cells
  const player = gameState.players.find(p => p.id === playerId);
  if (player) {
    if (elimination.type === 'horizontal') {
      player.matrix.splice(elimination.cells[0].r, 1);
      player.matrixRows = player.matrix.length;
    } else if (elimination.type === 'vertical') {
      const col = elimination.cells[0].c;
      for (let r = 0; r < player.matrix.length; r++) {
        player.matrix[r].splice(col, 1);
      }
      player.matrixCols = player.matrix[0]?.length || 0;
    }
    computeLayout();
  }
}

  { note: 'D2', dur: 0.5 }, { note: 'F#2', dur: 0.5 }, { note: 'A2', dur: 0.5 }, { note: 'F#2', dur: 0.5 },
  // G
  { note: 'G2', dur: 0.5 }, { note: 'B2', dur: 0.5 }, { note: 'D3', dur: 0.5 }, { note: 'B2', dur: 0.5 },
  // C
  { note: 'C2', dur: 0.5 }, { note: 'E2', dur: 0.5 }, { note: 'G2', dur: 0.5 }, { note: 'E2', dur: 0.5 },
  // F
  { note: 'F2', dur: 0.5 }, { note: 'A2', dur: 0.5 }, { note: 'C3', dur: 0.5 }, { note: 'A2', dur: 0.5 },
  // G
  { note: 'G2', dur: 0.5 }, { note: 'B2', dur: 0.5 }, { note: 'D3', dur: 0.5 }, { note: 'B2', dur: 0.5 },
  // C (resolve)
  { note: 'C2', dur: 0.5 }, { note: 'E2', dur: 0.5 }, { note: 'G2', dur: 0.5 }, { note: 'E2', dur: 0.5 },
];

const NOTE_FREQ = {
  'C2': 65.41, 'D2': 73.42, 'E2': 82.41, 'F2': 87.31, 'F#2': 92.50, 'G2': 98.00, 'A2': 110.00, 'B2': 123.47,
  'C3': 130.81, 'D3': 146.83, 'E3': 164.81, 'F3': 174.61, 'F#3': 185.00, 'G3': 196.00, 'A3': 220.00, 'B3': 246.94,
  'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23, 'F#4': 369.99, 'G4': 392.00, 'A4': 440.00, 'B4': 493.88,
  'C5': 523.25, 'D5': 587.33,
};

function startMusic() {
  if (musicPlaying) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.setValueAtTime(0.35, audioCtx.currentTime);
    masterGain.connect(audioCtx.destination);
    musicPlaying = true;
    document.getElementById('musicToggle').textContent = '♪ ON';
    playMelodyLoop();
  } catch (e) { console.log('Audio not available'); }
}

function playMelodyLoop() {
  if (!audioCtx || !musicPlaying) return;

  const tempo = 90; // Slower, gentler tempo
  const beatDur = 60 / tempo;
  let time = audioCtx.currentTime + 0.1;

  // Melody - soft sine wave
  for (const n of MELODY) {
    if (n.note !== 'REST') {
      playNote(NOTE_FREQ[n.note], time, n.dur * beatDur * 0.9, 'sine', 0.12);
      // Add subtle harmony (fifth above, very quiet)
      if (Math.random() > 0.6) {
        playNote(NOTE_FREQ[n.note] * 1.5, time, n.dur * beatDur * 0.5, 'sine', 0.03);
      }
    }
    time += n.dur * beatDur;
  }

  // Arpeggio accompaniment - triangle wave, very soft
  let arpTime = audioCtx.currentTime + 0.1;
  const totalMelodyTime = MELODY.reduce((s, n) => s + n.dur * beatDur, 0);
  const arpLoopDur = ARPEGGIO.reduce((s, n) => s + n.dur * beatDur, 0);
  const arpRepeats = Math.ceil(totalMelodyTime / arpLoopDur);

  for (let rep = 0; rep < arpRepeats; rep++) {
    for (const n of ARPEGGIO) {
      if (arpTime < audioCtx.currentTime + totalMelodyTime + 0.1) {
        playNote(NOTE_FREQ[n.note], arpTime, n.dur * beatDur * 0.7, 'triangle', 0.04);
      }
      arpTime += n.dur * beatDur;
    }
  }

  // Schedule next loop
  const loopDuration = totalMelodyTime * 1000;
  musicInterval = setTimeout(playMelodyLoop, loopDuration - 200);
}

function playNote(freq, startTime, duration, waveform, volume) {
  if (!audioCtx || !musicPlaying || !masterGain) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = waveform;
  osc.frequency.setValueAtTime(freq, startTime);
  
  // Soft attack and release envelope
  gain.gain.setValueAtTime(0.001, startTime);
  gain.gain.linearRampToValueAtTime(volume, startTime + 0.05); // soft attack
  gain.gain.setValueAtTime(volume, startTime + duration * 0.6);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration); // soft release
  
  osc.connect(gain);
  gain.connect(masterGain);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.05);
}

function toggleMusic() {
  const btn = document.getElementById('musicToggle');
  if (musicPlaying) {
    musicPlaying = false;
    clearTimeout(musicInterval);
    if (audioCtx) audioCtx.close();
    audioCtx = null;
    masterGain = null;
    btn.textContent = '♪ OFF';
  } else {
    startMusic();
    btn.textContent = '♪ ON';
  }
}

// ── INIT ──
resize();
</script>
